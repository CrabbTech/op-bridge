[project]
name = "op-bridge"
version = "0.1.0"
description = "MCP server that lets an AI model play, record and analyze a Teenage Engineering OP-1 Field over USB MIDI and USB audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "pillow>=10",
    "pydantic>=2.7",
    "pystoi>=0.4.1",
]

[project.scripts]
op-bridge = "op_bridge.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8",
    "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/op_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -s"
filterwarnings = ["ignore::DeprecationWarning:sounddevice"]
